[project]
name = "career-coach"
version = "0.1.0"
description = "Evidence-preserving resume and job extraction"
readme = "README.md"
authors = [
    { name = "kellytea", email = "ktran49@asu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "gliner>=0.2.30",
    "openai>=3.53.0",
    "pandas==3.1.1",
    "pydantic>=2.14.3",
    "pymupdf==2.1.0",
    "rdflib>=7.6.0",
    "streamlit>=1.67.0",
]

[project.scripts]

[project.optional-dependencies]
ner = [
    "spacy>=3.8.18",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.build-backend]
module-name = "career_coach.data_extraction"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
