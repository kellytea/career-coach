name: career-coach

x-application: &application
  image: career-coach-app:local
  build:
    context: .
  environment:
    DATABASE_URL: postgresql+psycopg://career:${POSTGRES_PASSWORD:-career_local}@postgres:5432/career
    CELERY_BROKER_URL: amqp://career:${RABBITMQ_PASSWORD:-career_local}@rabbitmq:5672//
    ARCHIVE_ROOT: /archive
    TAXONOMY_DIR: /app/data/taxonomy/onet/31.0
    HF_HOME: /models/huggingface
    EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
  volumes:
    - archive:/archive
    - models:/models

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_local}
      POSTGRES_DB: career
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4
    environment:
      RABBITMQ_DEFAULT_USER: career
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-career_local}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  init-db:
    <<: *application
    command: ["career-coach", "init-db"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *application
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      init-db:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    <<: *application
    command: ["celery", "-A", "career_coach.app:celery", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      init-db:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres:
  rabbitmq:
  archive:
  models:
